[project]
name = "borrowed-time"
version = "0.1.0"
description = "Borrowed Time - a PyWeek side-scrolling platformer about an hourglass life and the debt you take on to survive."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "panda3d>=1.10.14,<1.11",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
