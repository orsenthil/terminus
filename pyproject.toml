[project]
name = "terminus"
version = "1.0.0"
description = "Terminus - a PyWeek platformer: borrow time to accomplish the task, then pay back the debt."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "panda3d>=1.10.14,<1.11",
]

[dependency-groups]
dev = [
    "pytest",
]
# For standalone builds: uv run --group build python setup.py bdist_apps
build = [
    "setuptools",
    "pip",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
